production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # The scheduled tasks the admin lists under /admin/tasks (ScheduledTask): keep the ids and
  # cadences in step with app/services/scheduled_task.rb.
  sync_luma_events:
    class: SyncLumaEventsJob
    schedule: every 10 minutes
  luma_reminder:
    class: LumaReminderJob
    schedule: every day at 10am America/Santiago
