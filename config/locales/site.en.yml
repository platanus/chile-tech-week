      by: "BY %{company}"
  event_mailer:
    no_themes: "No topics"
    questions: "Questions? Write to us at"
    subjects:
      submitted: "We received your event · Chile Tech Week %{edition}"
      approved: "Event approved: edit your event on Luma · Chile Tech Week %{edition}"
      published: "Event published: %{title} · Chile Tech Week %{edition}"
      rejected: "Your event needs changes · Chile Tech Week %{edition}"
      luma_reminder: "Reminder: edit your event on Luma “%{title}”"
      luma_cancelled: "Event taken down: %{title}"
      taken_down: "Your event was taken down: %{title}"
      luma_updated: "Event updated: %{title}"
